<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the Tower - Matricular Aluno</title>
    <link rel="stylesheet" href="assets/css/matricular_aluno.css">
    </head>
    <body>

        <header class="cabecalho">
            <div class="barra-topo">
                <button class="btn-voltar" onclick="irPara('alunos.html')">⟵</button>
                <h1 id="titulo-pagina">Matricular Aluno</h1>
            </div>
        </header>

        <section class="container">

            <form id="formMatricula" class="formulario">

                <div class="coluna">
                    <label>*Nome completo</label>
                    <input type="text" id="nome" required>

                    <label>*Cidade</label>
                    <input type="text" id="cidade" required>

                    <label>*Email</label>
                    <input type="email" id="email" required>

                    <label>*Telefone</label>
                    <input type="text" id="telefone" placeholder="(11) 99999-9999" required>

                    <label>*Tipo Bancária</label>
                    <input type="text" id="tipo_bancaria" placeholder="Itáu / Banco do Brasil / Nubank" required>
                </div>

                <div class="coluna">
                    <label>*Bolsista</label>
                    <select id="bolsista">
                        <option value="0">Não</option>
                        <option value="1">Sim</option>
                    </select>

                    <label>*Nível</label>
                    <select id="nivel" required>
                        <option value="iniciante">Iniciante</option>
                        <option value="intermediario">Intermediário</option>
                        <option value="avancado">Avançado</option>
                    </select>

                    <label>*Turma</label>
                    <select id="turma" required></select>

                    <button type="submit" class="btn-enviar">Matricular aluno</button>
                </div>

            </form>
        </section>

        <script src="assets/js/auth-guard.js"></script>
        <script src="assets/js/matricular_aluno.js"></script>

    </body>
</html>
