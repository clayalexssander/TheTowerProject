<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="assets/js/validation.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tower - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/home.css">
</head>
    <body class="home-body">
        <header class="cabecalho">
            <div class="barra-topo">
                  <h1>Home</h1>
                  <button class="btn-logout" id="btnLogout" title="Sair da sessão">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                          <polyline points="16 17 21 12 16 7"></polyline>
                          <line x1="21" y1="12" x2="9" y2="12"></line>
                      </svg>
                      <span>Sair</span>
                  </button>
            </div>
        </header>

        <main class="container-home">
            <section class="boas-vindas">
                <div class="texto-boas-vindas" id="saudacao"></div>
            </section>

            <section class="agenda-hoje">
                <h2>Suas aulas de hoje</h2>
                <div id="lista-agenda" class="agenda-lista">
                </div>
            </section>

            <section class="grade-cards">
                <div class="coluna-esquerda">
                    <div class="card card-financas" onclick="irPara('financas.html')">
                        <p>Finanças</p>
                       
                    </div>

                    <div class="card card-turmas" onclick="irPara('turmas.html')">
                        <p>Turmas</p>
                        
                    </div>
                </div>

                <div class="coluna-central">
                    <div class="card card-analises" onclick="irPara('dashboard.html')">
                        <p>Minitoramento</p>
                        
                    </div>

                    <div class="card card-aulas" onclick="irPara('aulas_demonstrativas.html')">
                        <p>Aulas Aulas Demonstrativas</p>
                        
                    </div>

                    <div class="card card-aulas" onclick="irPara('alunos.html')">
                        <p>Gerenciameneto de Alunos</p>
                        
                    </div>
                </div>

                       

                <div class="coluna-direita">
                     <div class="card card-biblioteca"  onclick="irPara('biblioteca.html')">
                        <p>Biblioteca</p>
                        
                    </div>

                    <div class="card card-estoque" onclick="irPara('estoque.html')">
                        <p>Estoque</p>
                       
                    </div>

                    <div class="card card-eventos" onclick="irPara('cadastra_material.html')">
                        <p>Cadastro de Aulas</p>
                        
                    </div>
                </div>
            </section>
        </main>

        <script src="assets/js/auth-guard.js"></script>
        <script src="assets/js/home.js"></script>
    </body>
</html>
